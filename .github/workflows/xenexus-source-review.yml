# Temporary source-only review transport. No project code or tests execute.
name: xenexus-source-review
on:
  push:
    branches: [stratagem/isolation-remediation]
    paths: [.github/workflows/xenexus-source-review.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xenexus-source-review
  cancel-in-progress: true
jobs:
  source-copy:
    if: github.repository == 'stratagem-group/starnet' && github.ref == 'refs/heads/stratagem/isolation-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            **/*.js
            **/*.mjs
            **/*.cjs
            **/*.json
            **/*.html
            **/*.css
            **/*.svg
            **/*.rs
            **/*.toml
            **/*.lock
            **/*.yml
            **/*.yaml
            **/*.md
            **/*.list
            **/*.py
            **/*.sh
            **/*.ps1
            **/*.nsh
            **/*.plist
            **/Dockerfile*
            /.gitignore
            /LICENSE
            /NOTICE*
      - name: Archive bounded source tree as data only
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'xenexus-source-review'
          dest.mkdir()
          inventory = subprocess.check_output(['git', 'ls-tree', '-r', '-l', '-z', 'HEAD'])
          (dest / 'tracked-tree.bin').write_bytes(inventory)
          (dest / 'head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          allowed = {'.js','.mjs','.cjs','.json','.html','.css','.svg','.rs','.toml','.lock','.yml','.yaml','.md','.list','.py','.sh','.ps1','.nsh','.plist'}
          rows, skipped = [], []
          with tarfile.open(dest / 'source.tar.gz', 'w:gz', compresslevel=1) as arc:
              for record in inventory.split(b'\0'):
                  if not record: continue
                  meta, name = record.split(b'\t', 1)
                  path = pathlib.Path(os.fsdecode(name))
                  src = root / path
                  parts = path.parts
                  text = path.as_posix()
                  wanted = path.suffix in allowed or path.name in {'LICENSE','.gitignore','Dockerfile'}
                  if not wanted or not src.is_file() or src.is_symlink(): continue
                  # Source art, historical evidence and captured payloads are inventory-only.
                  if src.stat().st_size > 8_000_000 or any(x in parts for x in {'evidence','receipts','node_modules','.git','captures'}):
                      skipped.append(text); continue
                  if '/assets/' in text and path.suffix not in {'.json','.svg','.md'}: continue
                  raw = src.read_bytes()
                  try: raw.decode('utf-8')
                  except UnicodeDecodeError: skipped.append(text); continue
                  arc.add(src, arcname=text, recursive=False)
                  rows.append({'path':text,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
                  if len(rows) % 1000 == 0: print('Archived',len(rows),'files',flush=True)
          (dest / 'coverage.json').write_text(json.dumps({'sourceFiles':rows,'inventoryOnly':skipped,'applicationExecuted':False,'testsExecuted':False},indent=2))
          print('DONE:',len(rows),'files,',sum(x['bytes'] for x in rows),'bytes; no project code executed.',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xenexus-source-review
          path: ${{ runner.temp }}/xenexus-source-review/
          retention-days: 2
          if-no-files-found: error
